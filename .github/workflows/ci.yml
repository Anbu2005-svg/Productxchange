name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: productxchange, POSTGRES_PASSWORD: productxchange, POSTGRES_DB: productxchange }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U productxchange" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://productxchange:productxchange@localhost:5432/productxchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff
      - name: Lint check with Ruff
        run: ruff check backend/app
      - name: Verify database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run automated test suite
        working-directory: backend
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm install && npm run build
