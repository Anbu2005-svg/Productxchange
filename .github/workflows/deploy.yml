name: Deploy
on:
  push:
    branches: [main]
env:
  AWS_REGION: ap-south-1
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}"
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/productxchange-backend:${{ github.sha }} backend
          docker build -t ${{ steps.ecr.outputs.registry }}/productxchange-frontend:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_BASE=${{ secrets.PUBLIC_API_URL }} frontend
          docker push ${{ steps.ecr.outputs.registry }}/productxchange-backend:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/productxchange-frontend:${{ github.sha }}
      - name: Roll out ECS services
        run: |
          aws ecs update-service --cluster productxchange --service backend --force-new-deployment
          aws ecs update-service --cluster productxchange --service frontend --force-new-deployment
