<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — ProductXchange</title>
  <meta name="theme-color" content="#2F6B4F">
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --surface-muted: #F3F3F0;
      --border: #E6E5E0;
      --text: #161A18;
      --text-secondary: #4D5551;
      --text-tertiary: #6B726E;
      --primary: #2F6B4F;
      --primary-hover: #265A42;
      --primary-subtle: #EEF5F1;
      --on-primary: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1211;
        --surface: #161A18;
        --surface-muted: #1D2220;
        --border: #2A302D;
        --text: #ECEFED;
        --text-secondary: #A9B1AC;
        --text-tertiary: #8A928D;
        --primary: #5BB98C;
        --primary-hover: #74C9A0;
        --primary-subtle: #16261F;
        --on-primary: #0B1410;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary-subtle);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .btn-primary {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      border: none;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 150ms ease-out;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      flex: 1;
      height: 40px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms ease-out;
    }
    .btn-secondary:hover {
      border-color: var(--text-secondary);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-tertiary);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    
    <div class="status-badge">
      <span class="dot"></span>
      <span>No internet connection</span>
    </div>

    <h1>You Are Offline</h1>
    
    <p>
      Cached campus listings, your active deals, and saved handshake PINs remain available offline on this device.
    </p>

    <button class="btn-primary" onclick="checkConnection()">
      Retry connection
    </button>

    <div style="display: flex; gap: 0.5rem; width: 100%;">
      <a href="/deals" class="btn-secondary">My deals</a>
      <a href="/saved" class="btn-secondary">Saved</a>
    </div>
  </div>

  <script>
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn-primary');
        const orig = btn.textContent;
        btn.textContent = 'Still offline...';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    }

    window.addEventListener('online', () => {
      document.querySelector('.status-badge span:last-child').textContent = 'Reconnecting...';
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
