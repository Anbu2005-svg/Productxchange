<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — ProductXchange Campus</title>
  <meta name="theme-color" content="#2f6b4f">
  <style>
    :root {
      --moss: #2f6b4f;
      --moss-dark: #1e4d38;
      --emerald: #10b981;
      --sand: #f6f3ec;
      --ink: #1c2b24;
      --card-bg: #ffffff;
      --border: rgba(28, 43, 36, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sand: #131a16;
        --ink: #eaf1ed;
        --card-bg: #1b241f;
        --border: rgba(255, 255, 255, 0.1);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--sand);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .icon-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, #2f6b4f, #1b4332);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      box-shadow: 0 6px 16px rgba(47, 107, 79, 0.3);
    }
    .offline-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f59e0b;
      border: 2px solid var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.925rem;
      line-height: 1.5;
      opacity: 0.8;
      max-width: 360px;
    }
    .btn-primary {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 0.875rem;
      border: none;
      background: linear-gradient(135deg, #2f6b4f, #10b981);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-secondary {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0.875rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      🔄
      <div class="offline-badge">⚡</div>
    </div>
    
    <div class="status-indicator">
      <span class="dot"></span>
      <span>No Internet Connection</span>
    </div>

    <h1>You Are Offline</h1>
    
    <p>
      ProductXchange keeps your previously visited deals, saved watchlist, and verified Handshake PINs stored locally on your device.
    </p>

    <button class="btn-primary" onclick="checkConnection()">
      <span>↻</span>
      <span>Retry Connection</span>
    </button>

    <div style="display: flex; gap: 0.5rem; width: 100%;">
      <a href="/deals" class="btn-secondary">🤝 My Deals</a>
      <a href="/saved" class="btn-secondary">❤️ Saved Items</a>
    </div>
  </div>

  <script>
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn-primary span:last-child');
        const orig = btn.textContent;
        btn.textContent = 'Still offline...';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', () => {
      document.querySelector('.status-indicator span:last-child').textContent = 'Reconnecting...';
      document.querySelector('.dot').style.background = '#10b981';
      setTimeout(() => {
        window.location.reload();
      }, 600);
    });
  </script>
</body>
</html>
