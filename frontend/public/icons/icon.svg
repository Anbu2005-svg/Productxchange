<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6b4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12" />
  
  <!-- Stylized Circular Exchange Arrows & 'X' -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Main Center X & Exchange Leaf Graphic -->
    <path d="M 50 70 L 110 150 L 50 230" fill="none" stroke="#f6f3ec" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 250 70 L 190 150 L 250 230" fill="none" stroke="#f6f3ec" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 110 150 L 190 150" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Student / Campus Graduation Cap Accent -->
    <path d="M 150 40 L 90 75 L 150 110 L 210 75 Z" fill="#d8f3dc" />
    <polygon points="150,110 185,90 185,125 150,140 115,125 115,90" fill="#b7e4c7" />
    <path d="M 210 75 L 220 115" stroke="#f6f3ec" stroke-width="6" stroke-linecap="round" />
    <circle cx="220" cy="120" r="6" fill="#f6f3ec" />
  </g>
</svg>
